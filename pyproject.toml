[project]
name = "deep-research"
version = "0.1.0"
description = "Production-grade deep research agent - LangGraph multi-agent system implementing industry-standard agentic patterns"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.3.1",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "selectolax>=0.4.11",
    "tavily-python>=0.7.26",
    "truststore>=0.10.4",
    "uvicorn>=0.51.0",
]

[project.scripts]
research = "deep_research.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_research"]

# --------------------------------------------------------------------------
# Lint / format
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (likely bugs)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

# --------------------------------------------------------------------------
# Type checking
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tavily.*", "chromadb.*", "langfuse.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not evals'"
markers = [
    "evals: live evaluation suite (real API calls; run explicitly with -m evals)",
]

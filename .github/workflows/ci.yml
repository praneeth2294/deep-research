name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (reads .python-version)
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest

  evals:
    # Live eval suite: runs only when API keys are configured as repo secrets.
    # Small sample on PR; schedule a nightly run with EVAL_SAMPLE_SIZE bumped.
    runs-on: ubuntu-latest
    needs: quality
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      EVAL_SAMPLE_SIZE: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (reads .python-version)
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked
      - name: Run evals (skips automatically when secrets are absent)
        run: uv run pytest tests/evals -m evals -s
